<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PerúStream TV</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js para reproducción de streaming m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #0a0f1d; color: #ffffff; }
        .channel-card:hover { border-color: #f97316; transform: translateY(-2px); }
        .active-channel { border-color: #f97316 !important; background-color: rgba(249, 115, 22, 0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

    <!-- Navbar -->
    <header class="bg-black border-b border-gray-800 px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-2">
            <div class="bg-orange-500 w-4 h-8 rounded-sm"></div>
            <h1 class="text-2xl font-bold tracking-wider text-white">Perú<span class="text-orange-500">Stream</span> TV</h1>
        </div>
        <div class="w-full md:w-96">
            <input type="text" id="searchInput" placeholder="Buscar canal..." class="w-full bg-gray-900 border border-gray-800 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-orange-500">
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 flex flex-col gap-6">

        <!-- Reproductor de Video -->
        <div class="bg-black rounded-2xl border border-gray-800 overflow-hidden shadow-2xl flex flex-col">
            <div class="relative w-full aspect-video bg-gray-950 flex items-center justify-center">
                <video id="videoPlayer" class="w-full h-full object-contain" controls autoplay></video>
                <div id="errorOverlay" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center text-center p-4 hidden">
                    <span class="text-orange-500 text-3xl mb-2">⚠️</span>
                    <p class="text-gray-300 font-medium">No se pudo reproducir este canal o el enlace está caído.</p>
                    <p class="text-xs text-gray-500 mt-1">Prueba seleccionando otro canal de la lista inferior.</p>
                </div>
            </div>
            <div class="p-4 bg-gray-900/50 border-t border-gray-800 flex justify-between items-center">
                <div>
                    <h2 id="currentTitle" class="text-lg font-bold text-white">Selecciona un canal</h2>
                    <p id="currentCategory" class="text-xs text-gray-400">Plataforma de streaming</p>
                </div>
                <span class="bg-orange-500/10 text-orange-500 border border-orange-500/30 text-xs px-3 py-1 rounded-full font-semibold animate-pulse">EN VIVO</span>
            </div>
        </div>

        <!-- Categorías -->
        <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-none" id="categoryContainer">
            <button onclick="filterCategory('Todos')" class="cat-btn bg-orange-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition whitespace-nowrap">Todos</button>
            <button onclick="filterCategory('Señal Abierta Perú')" class="cat-btn bg-gray-900 text-gray-300 hover:bg-gray-800 px-4 py-2 rounded-lg text-sm font-semibold transition whitespace-nowrap border border-gray-800">Señal Abierta Perú</button>
            <button onclick="filterCategory('Noticias')" class="cat-btn bg-gray-900 text-gray-300 hover:bg-gray-800 px-4 py-2 rounded-lg text-sm font-semibold transition whitespace-nowrap border border-gray-800">Noticias</button>
            <button onclick="filterCategory('Internacional')" class="cat-btn bg-gray-900 text-gray-300 hover:bg-gray-800 px-4 py-2 rounded-lg text-sm font-semibold transition whitespace-nowrap border border-gray-800">Internacional</button>
        </div>

        <!-- Parrilla de Canales -->
        <div>
            <h3 class="text-lg font-bold mb-4 text-white">Canales Disponibles</h3>
            <div id="channelsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                <!-- Se inyecta por JavaScript -->
            </div>
        </div>

    </main>

    <!-- Script de control y canales -->
    <script>
        // Lista de canales optimizados y funcionales
        const channels = [
            {
                name: "TV Perú",
                category: "Señal Abierta Perú",
                url: "https://tvperu-live.bvi.tv/hls/live/202020/tvperu/index.m3u8",
                logo: "📺"
            },
            {
                name: "RPP TV",
                category: "Noticias",
                url: "https://rpp-live.bvi.tv/hls/live/202121/rpp/index.m3u8",
                logo: "📰"
            },
            {
                name: "DW en Español",
                category: "Internacional",
                url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8",
                logo: "🌍"
            },
            {
                name: "France 24 Español",
                category: "Internacional",
                url: "https://static.france24.com/live/F24_ES_HI_HLS/live_web.m3u8",
                logo: "📡"
            }
        ];

        let currentHls = null;
        const video = document.getElementById('videoPlayer');
        const errorOverlay = document.getElementById('errorOverlay');

        function loadChannel(url, name, category) {
            errorOverlay.classList.add('hidden');
            document.getElementById('currentTitle').innerText = name;
            document.getElementById('currentCategory').innerText = category;

            // Destruir instancia anterior de HLS si existe
            if (currentHls) {
                currentHls.destroy();
            }

            if (Hls.isSupported() && url.includes('.m3u8')) {
                currentHls = new Hls();
                currentHls.loadSource(url);
                currentHls.attachMedia(video);
                currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("Autoplay bloqueado:", e));
                });
                currentHls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        errorOverlay.classList.remove('hidden');
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl') || !url.includes('.m3u8')) {
                // Soporte nativo (Safari o MP4 directo)
                video.src = url;
                video.addEventListener('error', () => {
                    errorOverlay.classList.remove('hidden');
                });
                video.play().catch(e => console.log("Autoplay bloqueado:", e));
            } else {
                errorOverlay.classList.remove('hidden');
            }

            // Actualizar diseño activo en tarjetas
            document.querySelectorAll('.channel-card').forEach(card => {
                card.classList.remove('active-channel');
                if(card.dataset.name === name) {
                    card.classList.add('active-channel');
                }
            });
        }

        function renderChannels(filter = 'Todos', search = '') {
            const grid = document.getElementById('channelsGrid');
            grid.innerHTML = '';

            const filtered = channels.filter(c => {
                const matchesCat = filter === 'Todos' || c.category === filter;
                const matchesSearch = c.name.toLowerCase().includes(search.toLowerCase());
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<p class="text-gray-500 col-span-full text-center py-8">No se encontraron canales.</p>`;
                return;
            }

            filtered.forEach(channel => {
                const card = document.createElement('div');
                card.dataset.name = channel.name;
                card.className = `channel-card bg-gray-900 border border-gray-800 rounded-xl p-4 flex flex-col items-center justify-center gap-2 cursor-pointer transition duration-200`;
                card.innerHTML = `
                    <span class="text-3xl">${channel.logo}</span>
                    <span class="font-semibold text-sm text-center text-white">${channel.name}</span>
                    <span class="text-[10px] text-gray-400 bg-gray-800 px-2 py-0.5 rounded-full">${channel.category}</span>
                `;
                card.onclick = () => loadChannel(channel.url, channel.name, channel.category);
                grid.appendChild(card);
            });
        }

        function filterCategory(category) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-orange-500', 'text-white');
                btn.classList.add('bg-gray-900', 'text-gray-300', 'border', 'border-gray-800');
                if(btn.innerText === category) {
                    btn.classList.add('bg-orange-500', 'text-white');
                    btn.classList.remove('bg-gray-900', 'text-gray-300', 'border', 'border-gray-800');
                }
            });
            const searchVal = document.getElementById('searchInput').value;
            renderChannels(category, searchVal);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const activeCategoryBtn = document.querySelector('.cat-btn.bg-orange-500');
            const currentCat = activeCategoryBtn ? activeCategoryBtn.innerText : 'Todos';
            renderChannels(currentCat, e.target.value);
        });

        // Cargar el primer canal por defecto al abrir la web
        window.onload = () => {
            renderChannels();
            loadChannel(channels[0].url, channels[0].name, channels[0].category);
        };
    </script>
</body>
</html>
