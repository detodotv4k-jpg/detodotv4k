<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PerúStream TV - IPTV Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(139, 92, 246, 0.5) rgba(15, 23, 42, 0.5);
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.5);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 92, 246, 0.7);
        }
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
        }
        @media (max-width: 768px) {
            .channel-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
        }
        @media (max-width: 480px) {
            .channel-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 0.75rem;
            overflow: hidden;
        }
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .channel-item {
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .channel-item:hover {
            transform: translateY(-4px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100">
    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="text-2xl font-bold bg-gradient-to-r from-purple-500 to-cyan-500 bg-clip-text text-transparent">
                        ▶ PerúStream TV
                    </div>
                </div>
                <div class="flex-1 max-w-md mx-4">
                    <input type="text" id="searchInput" placeholder="Buscar canal..." class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20">
                </div>
                <button id="settingsBtn" class="p-2 hover:bg-slate-800 rounded-lg transition text-lg">
                    ⚙️
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <!-- Player Section -->
        <div class="mb-8">
            <div class="bg-slate-900 rounded-lg border border-slate-800 overflow-hidden">
                <div class="aspect-video bg-black rounded-lg mb-4 relative">
                    <div id="playerContainer" class="w-full h-full flex items-center justify-center">
                        <div class="text-center">
                            <div class="w-16 h-16 border-4 border-slate-700 border-t-purple-500 rounded-full animate-spin mx-auto mb-4"></div>
                            <p class="text-slate-400">Selecciona un canal para reproducir</p>
                        </div>
                    </div>
                </div>
                <div class="px-6 py-4 border-t border-slate-800">
                    <div class="flex justify-between items-center mb-3">
                        <h2 id="channelTitle" class="text-xl font-bold text-slate-100">Esperando selección...</h2>
                        <span id="liveStatus" class="px-3 py-1 bg-red-900/30 text-red-400 rounded text-sm font-semibold">EN VIVO</span>
                    </div>
                    <p id="channelDesc" class="text-slate-400 text-sm">Selecciona un canal de la lista para comenzar a reproducir</p>
                </div>
            </div>
        </div>

        <!-- Categories -->
        <div class="mb-8">
            <div class="flex gap-2 overflow-x-auto pb-2">
                <button class="category-btn px-4 py-2 bg-purple-600 text-white rounded-lg font-medium whitespace-nowrap transition hover:bg-purple-700" data-category="todos">
                    Todos
                </button>
                <button class="category-btn px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-medium whitespace-nowrap transition" data-category="peru">
                    Señal Abierta Perú
                </button>
                <button class="category-btn px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-medium whitespace-nowrap transition" data-category="noticias">
                    Noticias
                </button>
                <button class="category-btn px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-medium whitespace-nowrap transition" data-category="entretenimiento">
                    Entretenimiento
                </button>
                <button class="category-btn px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-medium whitespace-nowrap transition" data-category="deportes">
                    Deportes
                </button>
                <button class="category-btn px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-medium whitespace-nowrap transition" data-category="internacional">
                    Internacional
                </button>
            </div>
        </div>

        <!-- Channels Grid -->
        <div id="channelsContainer" class="channel-grid">
            <!-- Canales se cargarán aquí -->
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur flex items-center justify-center p-4">
        <div class="bg-slate-900 rounded-lg border border-slate-800 w-full max-w-md">
            <div class="p-6 border-b border-slate-800">
                <h3 class="text-xl font-bold text-slate-100">Cargar lista IPTV personalizada</h3>
                <p class="text-slate-400 text-sm mt-1">Pega tu lista M3U o enlaces IPTV</p>
            </div>
            <div class="p-6">
                <textarea id="iptvInput" placeholder="Ejemplo:&#10;#EXTINF:-1, Canal Nombre&#10;http://link.m3u8&#10;&#10;o solo pega uno por línea" class="w-full h-32 bg-slate-800 border border-slate-700 rounded-lg p-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 font-mono text-sm resize-none"></textarea>
            </div>
            <div class="p-6 border-t border-slate-800 flex gap-3">
                <button id="loadIptvBtn" class="flex-1 px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg font-medium transition">
                    Cargar
                </button>
                <button id="closeSettingsBtn" class="flex-1 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-medium transition">
                    Cerrar
                </button>
            </div>
        </div>
    </div>

    <script>
        const channels = [
            // Señal Abierta Perú
            { name: 'TV Perú', url: 'https://cdnhd.xyz/tvperu', category: 'peru', description: 'Canal estatal peruano' },
            { name: 'Latina', url: 'https://cdnhd.xyz/latina', category: 'peru', description: 'Televisión Latina' },
            { name: 'América TV', url: 'https://cdnhd.xyz/americatv', category: 'peru', description: 'Canal América TV' },
            { name: 'Panamericana', url: 'https://cdnhd.xyz/panamericana', category: 'peru', description: 'Panamericana Televisión' },
            { name: 'ATV', url: 'https://cdnhd.xyz/atv', category: 'peru', description: 'ATV Perú' },
            { name: 'RPP TV', url: 'https://cdnhd.xyz/rpptv', category: 'peru', description: 'RPP Televisión' },
            
            // Noticias
            { name: 'France 24', url: 'https://static.france24.com/live/F24_ES_LO.m3u8', category: 'noticias', description: 'Noticias internacionales' },
            { name: 'DW en Español', url: 'https://dw-1.akamaized.net/master.m3u8', category: 'noticias', description: 'Deutsche Welle' },
            { name: 'BBC News', url: 'https://bbcmedia.akamaized.net/bbc_mundo/live/hls/master.m3u8', category: 'noticias', description: 'BBC Mundo' },
            { name: 'CNN En Español', url: 'https://cnnlive-hd-1.akamaized.net/hls/live/622512/cnnlivelatam/master.m3u8', category: 'noticias', description: 'Noticias CNN' },
            
            // Entretenimiento
            { name: 'Miramax', url: 'https://vs20.live.opencaster.com/miramaxtv2026_b6128ab1/index.m3u8', category: 'entretenimiento', description: 'Cine y entretenimiento' },
            { name: 'HBO', url: 'https://hbo-hls.akamaized.net/hbo/master.m3u8', category: 'entretenimiento', description: 'HBO Latinoamérica' },
            { name: 'Disney Channel', url: 'https://disneychannel-hls.akamaized.net/disneychannel/master.m3u8', category: 'entretenimiento', description: 'Disney Channel' },
            { name: 'Cartoon Network', url: 'https://cartoon-hls.akamaized.net/cartoon/master.m3u8', category: 'entretenimiento', description: 'Dibujos animados' },
            
            // Deportes
            { name: 'ESPN', url: 'https://stream.sportstv.online/espn/index.m3u8', category: 'deportes', description: 'Deportes ESPN' },
            { name: 'FOX Sports', url: 'https://stream.sportstv.online/foxsports/index.m3u8', category: 'deportes', description: 'Fútbol y deportes' },
            { name: 'TNT Sports', url: 'https://stream.sportstv.online/tnt/index.m3u8', category: 'deportes', description: 'Transmisiones deportivas' },
            { name: 'Eurosport', url: 'https://eurosport-hls.akamaized.net/index.m3u8', category: 'deportes', description: 'Eventos europeos' },
            
            // Internacional
            { name: 'Euronews', url: 'https://euronews-live.akamaized.net/es.m3u8', category: 'internacional', description: 'Noticias europeas' },
            { name: 'Aljazeera', url: 'https://live-hls-web-aje.getaj.net/AJE/index.m3u8', category: 'internacional', description: 'Al Jazeera' },
            { name: 'TV5 Monde', url: 'https://tv5mondeplus-i.akamaized.net/hls/live/631786/tv5mondeplus/index.m3u8', category: 'internacional', description: 'Televisión francesa' },
            { name: 'NHK World', url: 'https://nhkwlive-xjp.akamaized.net/hls/live/2003458/nhkwlive-xjp/index.m3u8', category: 'internacional', description: 'NHK Japón' }
        ];

        let customChannels = [];
        let currentCategory = 'todos';
        let hlsInstance = null;

        function renderChannels() {
            const container = document.getElementById('channelsContainer');
            const allChannels = [...channels, ...customChannels];
            const filtered = currentCategory === 'todos' 
                ? allChannels 
                : allChannels.filter(ch => ch.category === currentCategory);

            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const searched = filtered.filter(ch => 
                ch.name.toLowerCase().includes(searchTerm) || 
                ch.description.toLowerCase().includes(searchTerm)
            );

            container.innerHTML = searched.map((channel, index) => `
                <div class="channel-item bg-slate-900 rounded-lg border border-slate-800 overflow-hidden hover:border-purple-500 cursor-pointer" onclick="playChannel('${channel.url.replace(/'/g, "\\'")}', '${channel.name.replace(/'/g, "\\'")}', '${channel.description.replace(/'/g, "\\'")}')">
                    <div class="aspect-square bg-gradient-to-br from-purple-600/20 to-cyan-600/20 flex items-center justify-center">
                        <span class="text-4xl">📺</span>
                    </div>
                    <div class="p-3">
                        <h3 class="font-bold text-slate-100 truncate">${channel.name}</h3>
                        <p class="text-xs text-slate-400 truncate">${channel.description}</p>
                        <div class="mt-2 text-xs font-semibold text-red-400">● EN VIVO</div>
                    </div>
                </div>
            `).join('');

            if (searched.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-12"><p class="text-slate-400">No se encontraron canales</p></div>';
            }
        }

        function playChannel(url, name, description) {
            const container = document.getElementById('playerContainer');
            document.getElementById('channelTitle').textContent = name;
            document.getElementById('channelDesc').textContent = description;

            container.innerHTML = `<div class="w-full h-full flex items-center justify-center"><div class="text-center"><div class="w-16 h-16 border-4 border-slate-700 border-t-purple-500 rounded-full animate-spin mx-auto mb-4"></div><p class="text-slate-400">Cargando ${name}...</p></div></div>`;

            setTimeout(() => {
                if (!window.Hls) {
                    container.innerHTML = `<video controls autoplay style="width:100%;height:100%;"><source src="${url}" type="application/x-mpegURL"></video>`;
                    return;
                }

                container.innerHTML = `<video id="hls-video" controls autoplay style="width:100%;height:100%;"></video>`;
                const video = document.getElementById('hls-video');

                if (window.Hls.isSupported()) {
                    if (hlsInstance) hlsInstance.destroy();
                    hlsInstance = new window.Hls({ debug: false, enableWorker: true, lowLatencyMode: true });
                    hlsInstance.loadSource(url);
                    hlsInstance.attachMedia(video);
                    hlsInstance.on(window.Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
                    hlsInstance.on(window.Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) container.innerHTML = `<div class="flex items-center justify-center w-full h-full text-red-400"><p>Error al cargar el stream</p></div>`;
                    });
                } else {
                    video.src = url;
                    video.play().catch(() => {});
                }
            }, 300);
        }

        // Event Listeners
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('bg-purple-600', 'text-white'));
                document.querySelectorAll('.category-btn').forEach(b => b.classList.add('bg-slate-800', 'text-slate-300'));
                btn.classList.remove('bg-slate-800', 'text-slate-300');
                btn.classList.add('bg-purple-600', 'text-white');
                currentCategory = btn.dataset.category;
                renderChannels();
            });
        });

        document.getElementById('searchInput').addEventListener('input', renderChannels);

        document.getElementById('settingsBtn').addEventListener('click', () => {
            document.getElementById('settingsModal').classList.toggle('hidden');
        });

        document.getElementById('closeSettingsBtn').addEventListener('click', () => {
            document.getElementById('settingsModal').classList.add('hidden');
        });

        document.getElementById('loadIptvBtn').addEventListener('click', () => {
            const input = document.getElementById('iptvInput').value.trim();
            if (!input) return;

            customChannels = [];
            const lines = input.split('\n');
            let currentName = '';

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    currentName = line.split(',').pop().trim();
                } else if (line && !line.startsWith('#') && line.includes('http')) {
                    if (currentName) {
                        customChannels.push({ name: currentName, url: line, category: 'personalizado', description: 'Canal personalizado' });
                    } else {
                        customChannels.push({ name: `Canal ${customChannels.length + 1}`, url: line, category: 'personalizado', description: 'Canal personalizado' });
                    }
                    currentName = '';
                }
            });

            document.getElementById('iptvInput').value = '';
            document.getElementById('settingsModal').classList.add('hidden');
            renderChannels();
        });

        // Cargar primer canal al iniciar
        window.addEventListener('load', () => {
            renderChannels();
            setTimeout(() => playChannel(channels[0].url, channels[0].name, channels[0].description), 500);
        });
    </script>
</body>
</html>
